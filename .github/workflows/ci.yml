name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # O runner Windows roda pwsh por padrão. Fixar bash aqui faz todos os passos
    # usarem o Git Bash — que é exatamente o interpretador pelo qual o Claude
    # Code roteia a statusline naquela plataforma quando ele está instalado.
    # Testar sob outro shell não diria nada sobre o caso real.
    #
    # `shell: bash` explícito também liga `pipefail`, que o default implícito não
    # tem. Por isso os passos abaixo trocaram `cmd --version | head -1` por uma
    # forma sem pipe: sob pipefail, um `head` que fecha o pipe antes de quem
    # escrever terminar derruba o passo inteiro por SIGPIPE.
    #
    # Medido: com a saída curta de `--version` isso não dispara, porque tudo cabe
    # no buffer do pipe antes do fechamento. Ou seja, a forma antiga passaria —
    # mas passaria por caber, não por estar certa, e o dia em que a saída crescer
    # a falha aparece no CI e não no comando que a causou.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install bats and jq (macOS)
        if: runner.os == 'macOS'
        run: brew install bats-core jq

      - name: Install bats and jq (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bats jq

      # O runner windows-latest já traz Git Bash e jq; falta o bats, que não tem
      # pacote nativo e vem por npm.
      - name: Install bats (Windows)
        if: runner.os == 'Windows'
        run: npm install -g bats

      - name: Record tool versions
        run: |
          bash -c 'printf "bash %s\n" "$BASH_VERSION"'
          bats --version
          jq --version
          uname -s

      - name: Run the test suite
        if: runner.os != 'Windows'
        run: bats -r tests

      # ── Por que o Windows roda só um pedaço ──
      #
      # Medido: a suíte inteira passa de vinte minutos no runner Windows, contra
      # um minuto e meio nos outros. Não é lentidão de teste, é o custo de criar
      # processo naquele sistema, e cada teste bats cria vários. Pagar isso em
      # toda PR — inclusive nas que só mexem em documentação — é caro demais
      # para uma plataforma em que ninguém desenvolve.
      #
      # O corte não é por tamanho, é por exposição. O que varia entre plataformas
      # são as chamadas externas, e elas estão todas em lib/ e no entrypoint:
      # `date` e `stat` mudam de sintaxe entre BSD e GNU, `awk`, `sed`, `tr`,
      # `cksum`, `jq` e `git` podem faltar ou divergir, e os caminhos mudam de
      # formato. tests/*.bats cobre exatamente isso, mais o golden e o smoke, que
      # exercitam o entrypoint de ponta a ponta.
      #
      # Os widgets ficam de fora porque consomem as bibliotecas em vez de tocar o
      # sistema — com uma exceção: widgets/command.sh cria subprocessos e depende
      # de `timeout`, que pode não existir ali, caindo num watchdog em bash puro.
      # Esse caminho de fallback é justamente o que roda no Windows.
      # TEMPORÁRIO — remover assim que as três causas estiverem identificadas.
      #
      # O run da suíte inteira no Windows deu 537 de 546, e as 9 falhas se
      # agrupam em três causas: sl_reset_label não produz saída, git-dir e
      # git-common-dir divergem na árvore principal, e o golden não acha o nome
      # do modelo. Nenhum log de bats mostra o VALOR que causou a falha, só a
      # asserção — daí este passo, que imprime os valores em vez de adivinhar.
      #
      # `set +e` e `|| true` porque o shell do job roda com -e -o pipefail: um
      # diagnóstico que aborta na primeira divergência esconde as seguintes, que
      # é exatamente o que ele existe para evitar.
      - name: Diagnose the Windows failures
        if: runner.os == 'Windows'
        run: |
          set +e
          echo "=============== plataforma ==============="
          uname -s; uname -r
          bash -c 'printf "bash %s\n" "$BASH_VERSION"'

          echo "=============== date ==============="
          date --version 2>&1 | sed -n 1p || true
          echo "-- a detecção de lib/timefmt.sh, passo a passo --"
          if date -r 0 +%s >/dev/null 2>&1; then echo "date -r 0  : OK   -> escolheria bsd"
          else                                   echo "date -r 0  : falha"; fi
          if date -d @0 +%s >/dev/null 2>&1; then echo "date -d @0 : OK   -> escolheria gnu"
          else                                   echo "date -d @0 : falha"; fi

          echo "-- o que a biblioteca de fato detecta e produz --"
          . lib/timefmt.sh
          echo "SL_DATE_FORM = '${SL_DATE_FORM}'"
          echo "sl_date_fmt 1800000000 '%H:%M' = '$(sl_date_fmt 1800000000 '%H:%M')' (exit $?)"
          echo "sl_date_fmt 1800000000 '%a'    = '$(sl_date_fmt 1800000000 '%a')' (exit $?)"
          echo "sl_date_fmt 1800000000 '%d%b'  = '$(sl_date_fmt 1800000000 '%d%b')' (exit $?)"
          echo "sl_reset_label 1800006480 1800000000 = '$(sl_reset_label 1800006480 1800000000)' (exit $?)"
          echo "-- LC_ALL=C sobrevive? --"
          echo "sem LC_ALL: '$(date -d @1800000000 +%a 2>&1)'"
          echo "com LC_ALL: '$(LC_ALL=C date -d @1800000000 +%a 2>&1)'"

          echo "=============== git ==============="
          git --version
          R="$(mktemp -d)"; git -C "$R" init -q
          git -C "$R" config user.email t@t.t; git -C "$R" config user.name t
          git -C "$R" config commit.gpgsign false
          printf 'a' > "$R/a.txt"; git -C "$R" add a.txt; git -C "$R" commit -qm initial
          echo "mktemp -d          : $R"
          echo "--git-dir          : $(cd "$R" && git rev-parse --git-dir)"
          echo "--git-common-dir   : $(cd "$R" && git rev-parse --git-common-dir)"
          echo "--show-toplevel    : $(cd "$R" && git rev-parse --show-toplevel)"
          echo "-- o que sl_git_paths devolve, com | no lugar das tabs --"
          . lib/cache.sh; . lib/gitdir.sh
          SL_CWD="$R"; sl_git_paths | tr '\t' '|'
          echo
          echo "-- iguais? é esta igualdade que separa árvore principal de worktree --"
          SL_CWD="$R"
          IFS="$(printf '\t')" read -r G C T <<< "$(sl_git_paths)"
          echo "gitdir='$G'"
          echo "common='$C'"
          [ "$G" = "$C" ] && echo "IGUAIS — correto" || echo "DIFEREM — esta é a causa B"

          echo "=============== golden ==============="
          # Reproduz o setup de tests/golden.bats exatamente: config própria com
          # duas linhas, cache isolado e um SL_FORECAST_BIN inexistente. A
          # rodada anterior deste diagnóstico usou outra config, então as saídas
          # não eram comparáveis e a causa continuou sem explicação.
          export XDG_CONFIG_HOME="$(mktemp -d)/config"
          export SL_CACHE_DIR="$(mktemp -d)/cache"
          export SL_FORECAST_BIN="/path/that/does/not/exist"
          mkdir -p "$XDG_CONFIG_HOME/claude-code-statusline"
          printf '%s\n' '{"version":1,"lines":[["model"],["rate-forecast"]],"separator":"|"}' \
            > "$XDG_CONFIG_HOME/claude-code-statusline/config.json"

          out="$(bash bin/statusline.sh < tests/fixtures/session.json)"
          echo "exit=$?"
          echo "-- o glob do teste casa? --"
          case "$out" in
            *"Opus 5"*) echo 'glob *Opus 5* : CASA' ;;
            *)          echo 'glob *Opus 5* : NAO CASA  <-- causa C' ;;
          esac
          echo "-- e as partes separadas? --"
          case "$out" in *Opus*) echo '  *Opus*  : casa' ;; *) echo '  *Opus*  : NAO' ;; esac
          case "$out" in *"5"*)  echo '  *5*     : casa' ;; *) echo '  *5*     : NAO' ;; esac
          echo "-- bytes da saída, para ver CR ou separador estranho --"
          printf '%s' "$out" | od -c | head -12
          echo "-- e o que o jq extraiu do campo --"
          jq -r '.model.display_name' tests/fixtures/session.json | od -c | head -3
          echo "-- locale, que é o que quebrou as regex --"
          locale 2>&1 | head -4
          exit 0

      - name: Run the platform-sensitive subset (Windows)
        if: runner.os == 'Windows'
        run: bats tests/*.bats tests/widgets/command.bats

      # bats runs the test files under whatever bash comes first in PATH, which
      # on a GitHub macOS runner is not guaranteed to be the system one. This
      # step pins /bin/bash — 3.2.57 on every macOS, frozen there since 2006
      # because bash 4.0 moved to GPLv3 — so a bash 4+ construct sneaking into
      # the entrypoint or any library fails here instead of on a user's machine.
      - name: Smoke test under system bash 3.2 (macOS)
        if: runner.os == 'macOS'
        run: |
          /bin/bash -c 'printf "system bash %s\n" "$BASH_VERSION"'
          out="$(/bin/bash bin/statusline.sh < tests/fixtures/session.json 2>err.log)"
          printf 'stdout: %s\n' "$out"
          # A statusline nunca sai com status diferente de zero por contrato, e
          # erro de sintaxe do bash vai para o stderr sem afetar o status. Sem
          # checar as duas coisas este passo passaria com o plugin quebrado.
          if [ -s err.log ]; then
            echo "FAIL: entrypoint wrote to stderr under bash 3.2"
            cat err.log
            exit 1
          fi
          case "$out" in
            *"Opus 5"*) ;;
            *) echo "FAIL: expected the model name in the output"; exit 1 ;;
          esac
